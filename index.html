<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Social links profile</title>
    <link rel="stylesheet" href="styles.css" />

  <body>
    <main>
      <article class="card">
        <img
          class="avatar"
          src="assets/images/avatar-sascha.jpg"

        />

          <h1 class="name">Sascha Khbabez</h1>
          <p class="location">Hamburg, Germany</p>
        </div>
        <p class="bio">"Developer sharpening front-end skills."</p>
        <ul class="linklist">
          <li><a href="https://github.com/skhbabez">GitHub</a></li>
          <li>
            <a href="https://www.frontendmentor.io/profile/skhbabez"
              >Frontend Mentor</a
            >
          </li>
          <li>
            <a href="www.linkedin.com/in/sascha-sin-abidin-khbabez-0182a32b3"
              >Linkedin</a
            >
          </li>
          <li><a href="#">Twitter</a></li>
          <li><a href="#">Instagram</a></li>
        </ul>
      </article>
    </main>
    <footer>
      <div class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >. Coded by <a href="#">Sascha Khbabez</a>.
      </div>
    </footer>
  </body>
</html>
